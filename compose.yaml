services:
  api:
    build: ./apps/api
    environment:
      CHOICELAB_DATABASE_PATH: /data/choicelab.sqlite3
    volumes:
      - choicelab-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        CHOICELAB_API_URL: http://api:8000
        NEXT_PUBLIC_CHOICELAB_DEMO_MODE: "true"
    environment:
      CHOICELAB_API_URL: http://api:8000
      NEXT_PUBLIC_CHOICELAB_DEMO_MODE: "true"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  choicelab-data:
